opensearch:
  enabled: true
  clusterName: opensearch-cluster
  nodeGroup: master
  masterService: opensearch-cluster-master
  replicas: 3

  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi

  opensearchJavaOpts: "-Xms2g -Xmx2g"

  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi

  # For an air-gapped deployment, set this to your mirrored image location.
  # global:
  #   dockerRegistry: registry.example.com/mirror

  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-initial-admin
          key: password

  securityConfig:
    enabled: true
    config:
      # The remaining security files supplied by the chart/image are retained.
      dataComplete: false
      data:
        config.yml: |-
          _meta:
            type: "config"
            config_version: 2

          config:
            dynamic:
              authc:
                basic_internal_auth_domain:
                  http_enabled: true
                  transport_enabled: true
                  order: 0
                  http_authenticator:
                    type: basic
                    challenge: false
                  authentication_backend:
                    type: internal

                openid_auth_domain:
                  http_enabled: true
                  transport_enabled: true
                  order: 1
                  http_authenticator:
                    type: openid
                    challenge: false
                    config:
                      subject_key: preferred_username
                      roles_key:
                        - realm_access
                        - roles
                      openid_connect_url: "https://auth.example.com/realms/cynix/.well-known/openid-configuration"
                      required_issuer: "https://auth.example.com/realms/cynix"
                      cache_jwks_endpoint: true
                  authentication_backend:
                    type: noop

opensearch-dashboards:
  enabled: true
  fullnameOverride: opensearch-dashboards
  replicaCount: 1

  opensearchHosts: "https://opensearch-cluster-master:9200"

  opensearchAccount:
    secret: opensearch-dashboards-account

  extraEnvs:
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: opensearch-dashboards-oidc
          key: client-secret

  config:
    opensearch_dashboards.yml: |-
      server.name: "opensearch-dashboards"
      server.host: "0.0.0.0"
      server.basePath: "/opensearch-dashboards"
      server.rewriteBasePath: true

      # Keep OIDC as the normal browser flow while allowing the bootstrap Job
      # to call the Dashboards saved-objects API with basic authentication.
      opensearch_security.auth.type: ["basicauth", "openid"]
      opensearch_security.auth.multiple_auth_enabled: true
      opensearch_security.auth.default_redirect_auth_type: "openid"
      opensearch_security.openid.connect_url: "https://auth.example.com/realms/cynix/.well-known/openid-configuration"
      opensearch_security.openid.client_id: "opensearch-dashboards"
      opensearch_security.openid.client_secret: "${OIDC_CLIENT_SECRET}"
      opensearch_security.openid.scope: "openid profile email"
      opensearch_security.openid.base_redirect_url: "https://logs.example.com/opensearch-dashboards"

      opensearch.username: "${OPENSEARCH_USERNAME}"
      opensearch.password: "${OPENSEARCH_PASSWORD}"
      # Replace this with certificateAuthorities in production.
      opensearch.ssl.verificationMode: "none"
      opensearch.requestHeadersAllowlist: ["Authorization", "securitytenant"]
      opensearch_security.cookie.secure: true

  # The parent chart supplies the Ingress so the path is passed through
  # unchanged to Dashboards when server.rewriteBasePath is enabled.
  ingress:
    enabled: false

ingress:
  enabled: true
  className: nginx
  host: logs.example.com
  path: /opensearch-dashboards
  tls:
    enabled: true
    secretName: logs-example-tls

opensearchSetup:
  enabled: true

  image:
    # Mirror this image into the air-gapped registry and override the repository.
    repository: python
    tag: 3.12-alpine
    pullPolicy: IfNotPresent

  opensearchUrl: https://opensearch-cluster-master:9200
  dashboardsUrl: https://opensearch-dashboards:5601/opensearch-dashboards

  authSecret:
    name: opensearch-bootstrap-auth
    usernameKey: username
    passwordKey: password

  # Leave name empty to reuse authSecret for Dashboards.
  dashboardsAuthSecret:
    name: ""
    usernameKey: username
    passwordKey: password

  dashboardsTenant: global
  importOverwrite: true
  waitTimeoutSeconds: 300

  tls:
    # The bundled chart currently uses self-signed transport certificates.
    # Set verify to true and provide caSecretName in production.
    verify: false
    # When set, this Secret must contain the key configured by caKey.
    caSecretName: ""
    caKey: ca.crt

  # The file is optional. When included in the chart, it must be an NDJSON
  # export from OpenSearch Dashboards with referenced objects included.
  savedObjectsFile: saved-objects/saved-objects.ndjson

  backoffLimit: 3

  operations:
    - method: PUT
      path: /_ingest/pipeline/container-logs
      body:
        description: Add the OpenSearch ingest timestamp
        processors:
          - set:
              field: event.ingested
              value: "{{{_ingest.timestamp}}}"
    - method: PUT
      path: /_index_template/container-logs
      body:
        index_patterns:
          - container-logs-*
        priority: 100
        template:
          settings:
            number_of_shards: 1
            number_of_replicas: 1
            default_pipeline: container-logs
          mappings:
            properties:
              "@timestamp":
                type: date
              event.ingested:
                type: date
              kubernetes.namespace_name:
                type: keyword
              kubernetes.pod_name:
                type: keyword
              kubernetes.container_name:
                type: keyword
